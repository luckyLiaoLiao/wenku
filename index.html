const CHAPTER_CONTENT = {
  1:`本报告依据国家相关法律法规及行业标准，对拟建项目进行全面、系统的可行性研究与论证。报告内容涵盖项目背景、市场分析、技术方案、环境保护、投资估算及财务分析等核心内容。\n\n项目建设符合国家产业发展政策，顺应区域经济发展战略规划，具有重要的经济意义和社会价值。项目实施后，将有效填补区域市场空白，带动上下游产业链协同发展。\n\n经综合评估，本项目技术方案成熟可靠，市场需求明确，财务效益良好，风险可控，建议批准立项并推进后续工作。`,
  2:`当前市场供需矛盾突出，现有产能无法满足快速增长的市场需求。随着国民经济持续发展，行业整体规模年均增速保持在15%以上，市场空间巨大。\n\n从政策环境看，国家连续出台支持性政策，明确将本行业列为重点发展领域，在土地、税收、融资等方面给予优惠支持，为项目推进提供了有力保障。\n\n本项目的建设是响应国家政策号召、填补区域市场空缺、推动产业转型升级的必然选择，建设必要性充分，时机窗口明确，实施条件具备。`,
  3:`根据市场调研数据，目标市场规模现已达到约380亿元，预计未来五年将以年均18.5%的复合增长率持续扩张，至2029年市场规模有望突破800亿元。\n\n在需求结构方面，B端企业客户占总需求的62%，C端个人用户占38%，且B端需求正处于快速增长通道。主要驱动力来自数字化转型加速、政策红利持续释放及消费升级需求共振。\n\n竞争格局方面，行业集中度偏低，CR5市占率合计不足35%，市场呈现典型的碎片化特征，头部企业尚未建立绝对壁垒，为本项目切入市场提供了充足空间。本项目预计投产后第三年可实现市占率3.2%，市场地位稳固。`,
  4:`项目选址综合考量交通区位、资源配套、政策环境及用地条件等核心要素，拟选定于目标区域工业园区内，占地面积约85亩。\n\n选址地区具备以下优势条件：园区配套水、电、气、网络等基础设施完善，承载能力强；距主干高速公路出口仅3.2公里，物流运输便捷高效；当地政府服务意识强，已出台专项招商政策，在土地价格及税收方面提供支持。\n\n地质勘察报告显示，场地地基承载力满足建设要求，无不良地质现象，工程建设条件优越。`,
  5:`项目采用业内主流技术路线，引进先进自动化生产线，核心工艺技术成熟可靠，已在国内同类项目中得到充分验证，运行稳定。\n\n主要设备选型遵循技术先进、经济合理、节能环保的原则。核心设备拟从国内一流制造商采购，关键技术指标均达到国内先进水平，整体自动化程度高，生产效率较传统工艺提升40%以上。\n\n信息化管理系统方面，将部署MES制造执行系统与ERP系统深度集成，实现生产全流程数字化管控，显著提升运营管理效率，降低人工成本。`,
  6:`项目严格落实国家环保"三同时"制度，废水、废气、固废排放全部达到相应行业排放标准。生产过程中产生的废水经处理后循环利用，废气通过负压收集处理系统处理达标后排放。\n\n安全生产方面，项目严格执行《安全生产法》及相关行业安全规范，配置完善的消防系统、安全监控系统及应急救援设施，确保本质安全。\n\n预计项目建设期内综合能耗指标符合行业准入标准，单位产值能耗低于区域平均水平12%，属于绿色低碳项目。`,
  7:`项目建立现代企业管理制度，采用矩阵式组织架构，设立生产运营、技术研发、市场营销、财务管理、人力资源等核心职能部门。\n\n项目运营期共需员工约320人，其中管理人员45人，技术人员86人，生产工人189人。管理层将通过内部培养与外部引进相结合的方式组建，确保核心岗位人员能力匹配。\n\n建立健全绩效考核体系，以KPI为导向，激励全员提质增效，持续提升组织竞争力。`,
  8:`项目总投资估算为12,680万元，其中建设投资10,240万元，铺底流动资金2,440万元。建设投资包括：土建工程3,820万元、设备购置及安装4,960万元、工程建设其他费用1,460万元。\n\n资金筹措方案：申请银行中长期贷款7,000万元，占总投资的55.2%；企业自筹资金5,680万元，占总投资的44.8%。贷款期限8年，年利率参照同期LPR执行。\n\n资金使用计划：建设期第一年投入4,200万元，主要用于土建施工及设备采购；第二年投入8,480万元，完成设备安装调试及试生产准备。`,
  9:`财务测算基于稳健预测原则，参照行业基准数据，对项目主要财务指标进行综合评价。\n\n主要财务指标：项目建成达产后年营收预计1.86亿元，年净利润2,340万元，净利润率12.6%。项目税后内部收益率（IRR）为18.7%，高于行业基准收益率8%的门槛值；项目投资回收期（含建设期）为6.8年，动态投资回收期7.2年。\n\n敏感性分析显示，在产品售价下降10%或原材料成本上涨15%的不利情景下，项目IRR仍维持在12%以上，具备较强的抗风险能力，财务可行性通过评估。`,
  10:`项目主要面临以下风险及相应对策：\n\n市场风险：市场需求增速不及预期，应对策略为多元化产品结构，锁定核心客户，签订长单框架协议，降低市场波动影响。\n\n技术风险：新工艺引进过程中可能面临技术适配问题，已通过引入原厂技术支持及设立专项技术攻关小组加以应对。\n\n政策风险：行业政策调整可能影响项目盈利空间，需持续跟踪政策动态，保持运营灵活性，及时调整经营策略。\n\n财务风险：融资利率上行将增加财务费用，可通过提前锁定部分固定利率贷款、合理安排还款节奏等方式对冲风险。`,
  11:`综合以上各章节分析，本项目具备以下核心优势：市场空间充足、技术路线成熟、选址条件优越、财务效益良好、风险整体可控。\n\n项目建设符合国家产业政策导向及区域发展规划，对推动地方经济发展、增加就业岗位、促进产业升级具有积极的社会意义。\n\n本报告认为，该项目在技术上可行、经济上合理、财务上可接受，建议有关部门批准立项，推动项目尽快进入实质性建设阶段，以把握当前有利的市场窗口。`,

function Badge({ text, color = "blue" }) {
  const colors = {
    blue: "bg-blue-100 text-blue-700",
    orange: "bg-orange-100 text-orange-700",
    green: "bg-green-100 text-green-700",
    gray: "bg-gray-100 text-gray-600",
    purple: "bg-purple-100 text-purple-700",
  };
  return <span className={`inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ${colors[color]}`}>{text}</span>;
}

function FormatBadge({ format }) {
  const map = { Word:"blue", PDF:"orange", PPT:"purple", Excel:"green" };
  return <Badge text={format} color={map[format] || "gray"} />;
}

    setResults({ term, data: term === "量子计算可行性" ? [] : SEARCH_RESULTS[key] || SEARCH_RESULTS.default });
  }, []);

  const handleHotClick = (tag) => { setQuery(tag); doSearch(tag); };
  const handleCategoryClick = (name) => { setQuery(name); doSearch(name); };

  const types = ["全部","报告","合同","方案","论文","总结"];
  const formats = ["全部","Word","PPT","PDF","Excel"];

    <div className="fade-in">

                    value={query}
                    onChange={e => setQuery(e.target.value)}
                    onKeyDown={e => e.key === "Enter" && doSearch(query)}
                  />
                  <button
                    className="px-7 py-2.5 bg-green-600 hover:bg-green-700 active:bg-green-800 text-white font-semibold rounded-xl transition-colors text-sm shadow-sm whitespace-nowrap"
                    onClick={() => doSearch(query)}>
                    搜索
                  </button>
                </div>
              </div>
              {/* Hot searches */}
              <div className="flex flex-wrap gap-2 justify-center mt-4">
                <span className="text-sm text-gray-400 self-center">热门：</span>
                {HOT_SEARCHES.map(tag => (
                  <button key={tag} onClick={() => handleHotClick(tag)}
                    className="text-sm text-green-600 hover:text-green-800 px-3 py-1 rounded-full border border-green-100 bg-green-50/60 hover:bg-green-50 transition-colors">
                    {tag}
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* ── Categories ── */}
          <div className="max-w-5xl mx-auto px-4 py-10">
            <h2 className="text-lg font-bold text-gray-900 mb-5">热门文档分类</h2>
            <div className="grid grid-cols-4 gap-4">
              {CATEGORIES.map(cat => (
                <button key={cat.name} onClick={() => handleCategoryClick(cat.name)}
                  className="group text-left bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-lg hover:border-gray-200 transition-all overflow-hidden">
                  <div className="h-28 flex items-center justify-center relative overflow-hidden"
                    style={{ background: `linear-gradient(135deg, ${cat.from}22 0%, ${cat.to}33 100%)` }}>
                    <div className="absolute inset-0 opacity-10 rounded-full w-40 h-40 -top-10 -right-10"
                      style={{ background: `radial-gradient(circle, ${cat.from}, transparent)` }} />
                    <span className="text-5xl relative z-10">{cat.icon}</span>
                  </div>
                  <div className="p-3.5">
                    <div className="text-sm font-semibold text-gray-800 group-hover:text-green-600 transition-colors">{cat.name}</div>
                    <div className="text-xs text-gray-400 mt-0.5">{cat.count}</div>
                  </div>
                </button>
              ))}
            </div>
          </div>

        </>
      ) : (
        <>
          {/* ── Sticky compact search (results view) ── */}
          <div className="py-3 px-4 border-b border-gray-100 bg-white/95 backdrop-blur-sm sticky top-14 z-10 shadow-sm">
            <div className="max-w-3xl mx-auto flex gap-2">
              <div className="flex-1 flex items-center bg-gray-50 border border-gray-200 rounded-xl overflow-hidden hover:border-green-300 focus-within:border-green-400 focus-within:ring-2 focus-within:ring-green-100 transition-all">
                <span className="pl-3.5 text-gray-400 text-sm shrink-0">🔍</span>
                <input
                  className="flex-1 px-3 py-2.5 text-base text-gray-800 placeholder-gray-400 bg-transparent"
                  placeholder="搜索报告、合同、方案、论文..."
                  value={query}
                  onChange={e => setQuery(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && doSearch(query)}
                />
                {query && (
                  <button className="px-3 text-gray-400 hover:text-gray-600 shrink-0" onClick={() => { setQuery(""); setResults(null); }}>✕</button>
                )}
              </div>
              <button
                className="px-6 py-2.5 bg-green-600 hover:bg-green-700 text-white font-medium rounded-xl transition-colors text-sm whitespace-nowrap"
                onClick={() => doSearch(query)}
              >搜索</button>
            </div>
          </div>

          <div className="max-w-5xl mx-auto px-4 py-5">
            {/* Filters */}
            <div className="flex flex-wrap gap-4 mb-5 p-3.5 bg-white rounded-2xl border border-gray-100 shadow-sm">
              <FilterGroup label="文档类型" options={types} value={typeFilter} onChange={setTypeFilter} />
              <div className="w-px bg-gray-200 self-stretch"></div>
              <FilterGroup label="格式" options={formats} value={formatFilter} onChange={setFormatFilter} />
              <div className="w-px bg-gray-200 self-stretch"></div>
              <FilterGroup label="排序" options={sorts} value={sortFilter} onChange={setSortFilter} />
            </div>

            {filteredData && filteredData.length === 0 ? (
              <EmptyState term={results.term} onGoToAI={onGoToAI} />
            ) : (
              <div className="space-y-3">
                <p className="text-sm text-gray-500 mb-1">
                  找到 <span className="font-semibold text-gray-800">{filteredData?.length}</span> 个相关文档
                </p>
                {filteredData?.map(doc => <DocCard key={doc.id} doc={doc} query={results.term} />)}
              </div>
            )}
          </div>
        </>
      )}
    </div>
  );
}

function FilterGroup({ label, options, value, onChange }) {
  return (
    <div className="flex items-center gap-2 flex-wrap">
      <span className="text-xs text-gray-400 shrink-0">{label}：</span>
      {options.map(opt => (
        <button key={opt} onClick={() => onChange(opt)}
          className={`text-xs px-3 py-1.5 rounded-full transition-colors font-medium ${
            value === opt ? "bg-green-600 text-white" : "bg-gray-100 text-gray-600 hover:bg-gray-200"
          }`}>
          {opt}
        </button>
      ))}
    </div>
  );
}

function DocCard({ doc, query }) {
  const highlight = (text) => {
    if (!query) return text;
    const parts = text.split(new RegExp(`(${query.split("").join("|")})`, "gi"));
    return parts.map((p, i) =>
      query.split("").some(c => p.toLowerCase() === c.toLowerCase())
        ? <mark key={i} className="bg-yellow-100 text-yellow-800 rounded px-0.5">{p}</mark>
        : p
    );
  };
  return (
    <div className="flex gap-4 p-4 bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-md hover:border-gray-200 transition-all group">
      <div className="flex flex-col items-center gap-1.5 pt-0.5 shrink-0">
        <span className="text-2xl">📄</span>
        <FormatBadge format={doc.format} />
      </div>
      <div className="flex-1 min-w-0">
        <h3 className="font-semibold text-gray-900 group-hover:text-green-600 transition-colors truncate text-base">
          {highlight(doc.title)}
        </h3>
        <p className="text-sm text-gray-500 mt-1.5 line-clamp-2 leading-relaxed">{doc.summary}</p>
        <div className="flex items-center gap-3 mt-2 text-xs text-gray-400">
          <span>👤 {doc.author}</span>
          <span>📅 {doc.date}</span>
          <span>⬇ {doc.downloads.toLocaleString()}</span>
        </div>
      </div>
      <div className="flex flex-col items-end justify-end gap-2 shrink-0">
        <button className="text-xs px-3.5 py-1.5 border border-green-400 text-green-600 rounded-lg hover:bg-green-50 transition-colors">预览</button>
        <button className="text-xs px-3.5 py-1.5 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors">下载</button>
      </div>
    </div>
  );
}

function EmptyState({ term, onGoToAI }) {
  return (
    <div className="flex flex-col items-center justify-center py-24 fade-in">
      <div className="w-20 h-20 rounded-2xl bg-gray-50 border border-gray-100 flex items-center justify-center mb-5 text-5xl">🔍</div>
      <h3 className="text-xl font-semibold text-gray-700 mb-2">未找到相关文档</h3>
      <p className="text-gray-400 mb-8 text-sm">没有找到与「{term}」相关的文档，试试 AI 帮你生成一份？</p>
      <button onClick={onGoToAI}
        className="flex items-center gap-2 px-7 py-3 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-xl transition-colors shadow-sm text-base">
        <span>✦</span> 让 AI 帮你生成
      </button>
    </div>
  );
}

// ─── AI Tab ───────────────────────────────────────────────────────────────────

function AITab() {
  const [step, setStep] = useState("type");
  const [docType, setDocType] = useState(null);
  const [formStep, setFormStep] = useState(1);
  const [formData, setFormData] = useState({
    industry:"", purpose:"", projectName:"", background:"",
    investment:"", period:"", detail:"", focuses:[], customIndustry:"",
  });
  const [genProgress, setGenProgress] = useState(0);

  const handleSelectType = (type) => { setDocType(type); setStep("form"); setFormStep(1); };
  const handleStartGenerate = () => {
    setStep("generating"); setGenProgress(0);
    let p = 0;
    const iv = setInterval(() => {
      p += Math.random() * 18 + 5;
      if (p >= 100) { p = 100; clearInterval(iv); setTimeout(() => setStep("result"), 400); }
      setGenProgress(Math.min(Math.floor(p), 100));
    }, 280);
  };

  if (step === "type") return <DocTypeSelect onSelect={handleSelectType} />;
  if (step === "form") return (
    <FormWizard
      docType={docType} formStep={formStep} formData={formData}
      setFormStep={setFormStep} setFormData={setFormData}
      onBack={() => { if (formStep === 1) setStep("type"); else setFormStep(f => f - 1); }}
      onGenerate={handleStartGenerate}
    />
  );
  if (step === "generating") return <GeneratingScreen progress={genProgress} />;
  if (step === "result") return <ResultEditor docType={docType} formData={formData} onRestart={() => setStep("type")} />;
  return null;
}

function DocTypeSelect({ onSelect }) {
  return (
    <div className="max-w-5xl mx-auto px-4 py-10 fade-in">
      <div className="text-center mb-10">
        <h2 className="text-2xl font-bold text-gray-900 mb-2">选择你要生成的文档类型</h2>
        <p className="text-gray-500">AI 将根据你的需求，生成专业的文档内容</p>
      </div>
      <div className="grid grid-cols-3 gap-5">
        {DOC_TYPES.map(t => (
          <button key={t.name} onClick={() => onSelect(t)}
            className="expert-card group text-left bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-xl hover:border-green-200 transition-all overflow-hidden">
            <div className="card-thumb h-40 flex items-center justify-center relative overflow-hidden"
              style={{ background: `linear-gradient(135deg, ${t.from}, ${t.to})` }}>
              <span className="text-6xl opacity-85 relative z-10">{t.icon}</span>
              <div className="absolute top-3 right-3 bg-white/20 backdrop-blur-sm text-white text-xs px-2.5 py-1 rounded-full font-medium border border-white/30">
                专家
              </div>
            </div>
            <div className="p-4">
              <div className="font-bold text-gray-900 text-base mb-1 group-hover:text-green-600 transition-colors">{t.name}</div>
              <div className="text-sm text-gray-500 leading-relaxed">{t.desc}</div>
              <div className="mt-3 text-xs text-gray-400">已生成 <span className="text-orange-500 font-semibold">{t.count}</span> 份</div>
            </div>
          </button>
        ))}
      </div>
    </div>
  );
}

function FormWizard({ docType, formStep, formData, setFormStep, setFormData, onBack, onGenerate }) {
  const update = (k, v) => setFormData(d => ({ ...d, [k]: v }));
  const toggleFocus = (f) => {
    setFormData(d => ({
      ...d,
      focuses: d.focuses.includes(f) ? d.focuses.filter(x => x !== f) : (d.focuses.length < 3 ? [...d.focuses, f] : d.focuses)
    }));
  };
  const canNext1 = formData.industry && formData.purpose;
  const canNext2 = formData.projectName;
  const canGenerate = formData.detail && formData.focuses.length > 0;
  const steps = ["基本信息", "项目详情", "报告偏好"];

  return (
    <div className="max-w-2xl mx-auto px-4 py-10 fade-in">
      {/* Progress */}
      <div className="mb-8">
        <div className="flex items-center justify-between">
          {steps.map((s, i) => (
            <React.Fragment key={s}>
              <div className="flex items-center gap-2">
                <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-semibold transition-all ${
                  i + 1 < formStep ? "bg-green-600 text-white" : i + 1 === formStep ? "bg-green-600 text-white ring-4 ring-green-100" : "bg-gray-100 text-gray-400"
                }`}>{i + 1 < formStep ? "✓" : i + 1}</div>
                <span className={`text-sm font-medium ${i + 1 === formStep ? "text-green-600" : "text-gray-400"}`}>{s}</span>
              </div>
              {i < 2 && <div className={`flex-1 h-0.5 mx-3 transition-colors ${i + 1 < formStep ? "bg-green-500" : "bg-gray-200"}`}></div>}
            </React.Fragment>
          ))}
        </div>
      </div>

      <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <div className="text-xs font-semibold text-green-600 mb-1 flex items-center gap-1.5">
          <span>{docType.icon}</span> 正在生成：{docType.name}
        </div>

        {formStep === 1 && (
          <div className="slide-in">
            <h3 className="text-lg font-bold text-gray-800 mb-5 mt-2">基本信息</h3>
            <div className="mb-5">
              <label className="block text-sm font-medium text-gray-700 mb-2">行业领域 <span className="text-red-400">*</span></label>
              <div className="grid grid-cols-4 gap-2">
                {INDUSTRIES.map(ind => (
                  <button key={ind.name} onClick={() => update("industry", ind.name)}
                    className={`flex flex-col items-center gap-1 p-3 rounded-xl border-2 text-center transition-all ${
                      formData.industry === ind.name ? "border-green-500 bg-green-50 text-green-700" : "border-gray-200 hover:border-green-200 text-gray-700"
                    }`}>
                    <span className="text-xl">{ind.icon}</span>
                    <span className="text-xs font-medium">{ind.name}</span>
                  </button>
                ))}
              </div>
              {formData.industry === "其他" && (
                <input className="mt-2 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:border-green-400 transition-colors"
                  placeholder="请输入行业领域" value={formData.customIndustry}
                  onChange={e => update("customIndustry", e.target.value)} />
              )}
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-2">报告用途 <span className="text-red-400">*</span></label>
              <div className="grid grid-cols-2 gap-2">
                {REPORT_PURPOSES.map(p => (
                  <button key={p} onClick={() => update("purpose", p)}
                    className={`py-2.5 px-4 rounded-xl border-2 text-sm font-medium transition-all ${
                      formData.purpose === p ? "border-green-500 bg-green-50 text-green-700" : "border-gray-200 hover:border-green-200 text-gray-700"
                    }`}>{p}</button>
                ))}
              </div>
            </div>
          </div>
        )}

        {formStep === 2 && (
          <div className="slide-in">
            <h3 className="text-lg font-bold text-gray-800 mb-5 mt-2">项目详情</h3>
            <div className="mb-4">
              <label className="block text-sm font-medium text-gray-700 mb-1.5">项目名称 <span className="text-red-400">*</span></label>
              <input className="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:border-green-400 transition-colors"
                placeholder="如：XX市智慧停车场建设项目"
                value={formData.projectName} onChange={e => update("projectName", e.target.value)} />
            </div>
            <div className="mb-4">
              <label className="block text-sm font-medium text-gray-700 mb-1.5">项目背景概述</label>
              <textarea className="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:border-green-400 transition-colors resize-none"
                placeholder="简要描述项目背景、解决的问题..." rows={4}
                value={formData.background} onChange={e => update("background", e.target.value)} />
            </div>
            <div className="mb-4">
              <label className="block text-sm font-medium text-gray-700 mb-2">预计投资规模</label>
              <div className="flex flex-wrap gap-2">
                {INVESTMENT_SCALES.map(s => (
                  <button key={s} onClick={() => update("investment", s)}
                    className={`px-3 py-1.5 rounded-lg border text-sm transition-all ${
                      formData.investment === s ? "border-green-500 bg-green-50 text-green-700 font-medium" : "border-gray-200 hover:border-green-200 text-gray-600"
                    }`}>{s}</button>
                ))}
              </div>
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-2">项目周期</label>
              <div className="flex flex-wrap gap-2">
                {PROJECT_PERIODS.map(p => (
                  <button key={p} onClick={() => update("period", p)}
                    className={`px-3 py-1.5 rounded-lg border text-sm transition-all ${
                      formData.period === p ? "border-green-500 bg-green-50 text-green-700 font-medium" : "border-gray-200 hover:border-green-200 text-gray-600"
                    }`}>{p}</button>
                ))}
              </div>
            </div>
          </div>
        )}

        {formStep === 3 && (
          <div className="slide-in">
            <h3 className="text-lg font-bold text-gray-800 mb-5 mt-2">报告偏好</h3>
            <div className="mb-5">
              <label className="block text-sm font-medium text-gray-700 mb-2">报告详细程度 <span className="text-red-400">*</span></label>
              <div className="grid grid-cols-3 gap-3">
                {DETAIL_LEVELS.map(d => (
                  <button key={d.label} onClick={() => update("detail", d.label)}
                    className={`py-3 px-4 rounded-xl border-2 text-center transition-all ${
                      formData.detail === d.label ? "border-green-500 bg-green-50" : "border-gray-200 hover:border-green-200"
                    }`}>
                    <div className={`text-sm font-semibold ${formData.detail === d.label ? "text-green-700" : "text-gray-700"}`}>{d.label}</div>
                    <div className="text-xs text-gray-400 mt-0.5">{d.desc}</div>
                  </button>
                ))}
              </div>
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1.5">
                重点章节 <span className="text-red-400">*</span>
                <span className="text-gray-400 font-normal text-xs ml-1">（最多选3个，已选{formData.focuses.length}个）</span>
              </label>
              <div className="grid grid-cols-3 gap-2">
                {FOCUS_SECTIONS.map(f => {
                  const selected = formData.focuses.includes(f);
                  const disabled = !selected && formData.focuses.length >= 3;
                  return (
                    <button key={f} onClick={() => !disabled && toggleFocus(f)}
                      className={`py-2.5 px-3 rounded-xl border-2 text-sm transition-all ${
                        selected ? "border-green-500 bg-green-50 text-green-700 font-medium"
                        : disabled ? "border-gray-100 bg-gray-50 text-gray-300 cursor-not-allowed"
                        : "border-gray-200 hover:border-green-200 text-gray-700"
                      }`}>{selected && "✓ "}{f}</button>
                  );
                })}
              </div>
            </div>
          </div>
        )}

        <div className="flex justify-between mt-7 pt-5 border-t border-gray-100">
          <button onClick={onBack}
            className="px-5 py-2.5 border border-gray-300 text-gray-600 rounded-xl hover:bg-gray-50 transition-colors text-sm font-medium">
            {formStep === 1 ? "← 返回选择" : "← 上一步"}
          </button>
          {formStep < 3 ? (
            <button
              disabled={formStep === 1 ? !canNext1 : !canNext2}
              onClick={() => setFormStep(f => f + 1)}
              className={`px-6 py-2.5 rounded-xl text-sm font-semibold transition-colors ${
                (formStep === 1 ? canNext1 : canNext2)
                  ? "bg-green-600 text-white hover:bg-green-700"
                  : "bg-gray-100 text-gray-400 cursor-not-allowed"
              }`}>
              下一步 →
            </button>
          ) : (
            <button
              disabled={!canGenerate}
              onClick={onGenerate}
              className={`px-7 py-2.5 rounded-xl text-sm font-semibold transition-colors ${
                canGenerate ? "bg-green-600 text-white hover:bg-green-700 shadow-sm" : "bg-gray-100 text-gray-400 cursor-not-allowed"
              }`}>
              开始生成 🚀
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function GeneratingScreen({ progress }) {
  const msgs = ["正在分析项目信息...", "构建报告结构框架...", "AI 正在撰写各章节内容...", "优化表达与格式..."];
  const msgIdx = Math.min(Math.floor(progress / 25), 3);
  const steps = ["分析行业背景", "生成目录结构", "撰写正文内容", "完善细节数据"];
  return (
    <div className="flex flex-col items-center justify-center min-h-[32rem] py-20 fade-in">
      <div className="w-20 h-20 rounded-2xl bg-gradient-to-br from-green-400 to-emerald-600 flex items-center justify-center mb-8 shadow-lg">
        <span className="text-4xl">🤖</span>
      </div>
      <h3 className="text-2xl font-bold text-gray-800 mb-2">AI 正在为您生成报告</h3>
      <p className="text-gray-500 text-sm mb-10">{msgs[msgIdx]}</p>
      <div className="w-80">
        <div className="flex justify-between text-xs text-gray-400 mb-2">
          <span>生成进度</span><span className="font-semibold text-gray-700">{progress}%</span>
        </div>
        <div className="h-2.5 bg-gray-100 rounded-full overflow-hidden">
          <div className="h-full bg-gradient-to-r from-green-500 to-emerald-400 rounded-full transition-all duration-300"
            style={{ width: `${progress}%` }}></div>
        </div>
      </div>
      <div className="mt-10 grid grid-cols-2 gap-2.5 text-xs">
        {steps.map((t, i) => {
          const done = i * 25 < progress;
          return (
            <div key={i} className={`px-4 py-2 rounded-xl font-medium flex items-center gap-2 ${
              done ? "text-green-700 bg-green-50 border border-green-100" : "text-gray-400 bg-gray-50"
            }`}>
              <span>{done ? "✓" : "◌"}</span> {t}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ResultEditor({ docType, formData, onRestart }) {
  const [title, setTitle] = useState(`${formData.projectName || "XX项目"}可行性研究报告`);
  const [editingTitle, setEditingTitle] = useState(false);
  const [activeChapter, setActiveChapter] = useState(1);
  const [contents, setContents] = useState(() => {
    const m = {};
    CHAPTERS.forEach(c => { m[c.id] = CHAPTER_CONTENT[c.id] || ""; });
    return m;
  });
  const [editingId, setEditingId] = useState(null);
  const [editBuffer, setEditBuffer] = useState("");
  const [regeneratingId, setRegeneratingId] = useState(null);
  const [savedMsg, setSavedMsg] = useState(false);
  const sectionRefs = useRef({});
  const focusKeys = { "市场分析":3, "技术方案":5, "财务分析":9, "风险评估":10 };
  const starChapterIds = new Set(formData.focuses.map(f => focusKeys[f]).filter(Boolean));

  const scrollTo = (id) => {
    setActiveChapter(id);
    const el = sectionRefs.current[id];
    if (el) el.scrollIntoView({ behavior:"smooth", block:"start" });
  };
  const startEdit = (id) => { setEditingId(id); setEditBuffer(contents[id]); };
  const saveEdit = () => { setContents(c => ({ ...c, [editingId]: editBuffer })); setEditingId(null); };
  const cancelEdit = () => setEditingId(null);
  const regenerate = (id) => {
    setRegeneratingId(id);
    setTimeout(() => {
      const alt = CHAPTER_CONTENT_ALT[id];
      setContents(c => ({ ...c, [id]: alt || CHAPTER_CONTENT[id] }));
      setRegeneratingId(null);
    }, 1500);
  };
  const handleSaveDraft = () => { setSavedMsg(true); setTimeout(() => setSavedMsg(false), 2000); };

  const chNum = ["一","二","三","四","五","六","七","八","九","十","十一"];

  return (
    <div className="flex flex-col h-screen fade-in">
      {/* Toolbar */}
      <div className="flex items-center justify-between px-5 py-3 bg-white border-b border-gray-200 shadow-sm">
        <div className="flex items-center gap-2">
          {editingTitle ? (
            <input className="text-lg font-bold text-gray-900 border-b-2 border-green-400 focus:outline-none px-1 bg-transparent"
              value={title} onChange={e => setTitle(e.target.value)} onBlur={() => setEditingTitle(false)}
              onKeyDown={e => e.key === "Enter" && setEditingTitle(false)} autoFocus />
          ) : (
            <h1 className="text-lg font-bold text-gray-900 cursor-pointer hover:text-green-600 transition-colors" onClick={() => setEditingTitle(true)}>{title}</h1>
          )}
          <button className="text-gray-400 hover:text-gray-600 text-sm ml-1" onClick={() => setEditingTitle(true)}>✏️</button>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={handleSaveDraft} className="text-sm text-gray-500 hover:text-gray-700 px-3 py-1.5 transition-colors">
            {savedMsg ? <span className="text-green-600 font-medium">✓ 已保存</span> : "保存草稿"}
          </button>
          <button onClick={onRestart} className="text-sm px-4 py-1.5 border border-gray-300 text-gray-600 rounded-lg hover:bg-gray-50 transition-colors">重新生成</button>
          <button className="text-sm px-4 py-1.5 bg-green-600 hover:bg-green-700 text-white rounded-lg transition-colors font-semibold shadow-sm">导出 Word ↓</button>
        </div>
      </div>

      <div className="flex flex-1 min-h-0">
        {/* Outline */}
        <div className="w-60 shrink-0 bg-white border-r border-gray-100 overflow-y-auto">
          <div className="px-4 py-3 border-b border-gray-100">
            <div className="text-xs font-semibold text-gray-400 uppercase tracking-wider">文档大纲</div>
          </div>
          <nav className="p-2">
            {CHAPTERS.map(ch => {
              const isStar = starChapterIds.has(ch.id);
              const isActive = activeChapter === ch.id;
              return (
                <button key={ch.id} onClick={() => scrollTo(ch.id)}
                  className={`w-full text-left px-3 py-2 rounded-xl text-sm transition-all mb-0.5 flex items-center gap-1.5 ${
                    isActive ? "bg-green-50 text-green-700 font-semibold" : "text-gray-600 hover:bg-gray-50"
                  }`}>
                  <span className="text-gray-400 text-xs w-5 shrink-0">{ch.id}.</span>
                  <span className="truncate flex-1">{ch.title}</span>
                  {isStar && <span className="shrink-0 text-orange-400 text-xs">⭐</span>}
                </button>
              );
            })}
          </nav>
        </div>

        {/* Content */}
        <div className="flex-1 overflow-y-auto bg-gray-50">
          <div className="max-w-3xl mx-auto py-6 px-6">
            {CHAPTERS.map(ch => {
              const isStar = starChapterIds.has(ch.id);
              const isEditing = editingId === ch.id;
              const isRegen = regeneratingId === ch.id;
              return (
                <div key={ch.id} ref={el => sectionRefs.current[ch.id] = el}
                  className="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden mb-4">
                  <div className="flex items-center justify-between px-5 py-3.5 border-b border-gray-50 bg-gray-50/60">
                    <div className="flex items-center gap-2.5">
                      <h2 className="text-base font-bold text-gray-900">
                        {chNum[ch.id - 1]}、{ch.title}
                      </h2>
                      {isStar && (
                        <span className="text-xs bg-orange-50 text-orange-600 border border-orange-200 px-2 py-0.5 rounded-full">⭐ 重点章节</span>
                      )}
                    </div>
                    {!isEditing && !isRegen && (
                      <div className="flex items-center gap-1">
                        <button onClick={() => regenerate(ch.id)}
                          className="w-7 h-7 flex items-center justify-center rounded-lg text-gray-400 hover:bg-gray-100 hover:text-gray-600 transition-colors text-sm" title="重新生成">
                          🔄
                        </button>
                        <button onClick={() => startEdit(ch.id)}
                          className="w-7 h-7 flex items-center justify-center rounded-lg text-gray-400 hover:bg-gray-100 hover:text-gray-600 transition-colors text-sm" title="编辑">
                          ✏️
                        </button>
                      </div>
                    )}
                  </div>
                  <div className="px-5 py-4">
                    {isRegen ? (
                      <div className="space-y-2.5">
                        {[100, 85, 70, 80, 60].map((w, i) => (
                          <div key={i} className="skeleton h-4 rounded" style={{ width: `${w}%` }}></div>
                        ))}
                      </div>
                    ) : isEditing ? (
                      <div>
                        <textarea
                          className="w-full border border-green-300 rounded-xl px-4 py-3 text-sm text-gray-700 leading-relaxed resize-none focus:border-green-500 focus:ring-2 focus:ring-green-100 transition-all"
                          rows={8} value={editBuffer} onChange={e => setEditBuffer(e.target.value)} autoFocus
                        />
                        <div className="flex gap-2 mt-2">
                          <button onClick={saveEdit} className="px-4 py-1.5 bg-green-600 text-white text-sm rounded-lg hover:bg-green-700 transition-colors font-medium">保存</button>
                          <button onClick={cancelEdit} className="px-4 py-1.5 border border-gray-300 text-gray-600 text-sm rounded-lg hover:bg-gray-50 transition-colors">取消</button>
                        </div>
                      </div>
                    ) : (
                      <div className="text-sm text-gray-700 leading-relaxed whitespace-pre-line">{contents[ch.id]}</div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
          <div className="sticky bottom-0 bg-white/95 backdrop-blur-sm border-t border-gray-100">
            <div className="max-w-3xl mx-auto px-6 py-2.5 text-xs text-gray-400">
              💡 点击章节右侧编辑按钮可修改内容，完成后点击「导出 Word」下载
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── App Shell ────────────────────────────────────────────────────────────────

      {/* Navbar */}
      <nav className="fixed top-0 left-0 right-0 h-14 bg-white border-b border-gray-100 shadow-sm z-50 flex items-center px-6">
        {/* Brand */}
        <div className="flex items-center gap-2 cursor-pointer shrink-0" onClick={() => setTab("search")}>
          <div className="w-8 h-8 bg-green-500 rounded-lg flex items-center justify-center shadow-sm">
            <span className="text-white text-sm font-black">文</span>
          </div>
          <span className="font-bold text-base text-gray-900">360文库</span>
        </div>

        {/* Nav tabs - centered */}
        <div className="absolute left-1/2 -translate-x-1/2 flex items-center gap-1">
          {[
            { key:"search", label:"搜索文档" },
            { key:"ai", label:"AI 生成" },
          ].map(t => (
            <button key={t.key} onClick={() => setTab(t.key)}

          : <AITab />
        }
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
