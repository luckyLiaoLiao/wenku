const CHAPTER_CONTENT = {
  1:`本报告依据国家相关法律法规及行业标准，对拟建项目进行全面、系统的可行性研究与论证。报告内容涵盖项目背景、市场分析、技术方案、环境保护、投资估算及财务分析等核心内容。\n\n项目建设符合国家产业发展政策，顺应区域经济发展战略规划，具有重要的经济意义和社会价值。项目实施后，将有效填补区域市场空白，带动上下游产业链协同发展。\n\n经综合评估，本项目技术方案成熟可靠，市场需求明确，财务效益良好，风险可控，建议批准立项并推进后续工作。`,
  2:`当前市场供需矛盾突出，现有产能无法满足快速增长的市场需求。随着国民经济持续发展，行业整体规模年均增速保持在15%以上，市场空间巨大。\n\n从政策环境看，国家连续出台支持性政策，明确将本行业列为重点发展领域，在土地、税收、融资等方面给予优惠支持，为项目推进提供了有力保障。\n\n本项目的建设是响应国家政策号召、填补区域市场空缺、推动产业转型升级的必然选择，建设必要性充分，时机窗口明确，实施条件具备。`,
  3:`根据市场调研数据，目标市场规模现已达到约380亿元，预计未来五年将以年均18.5%的复合增长率持续扩张，至2029年市场规模有望突破800亿元。\n\n在需求结构方面，B端企业客户占总需求的62%，C端个人用户占38%，且B端需求正处于快速增长通道。主要驱动力来自数字化转型加速、政策红利持续释放及消费升级需求共振。\n\n竞争格局方面，行业集中度偏低，CR5市占率合计不足35%，市场呈现典型的碎片化特征，头部企业尚未建立绝对壁垒，为本项目切入市场提供了充足空间。`,
  4:`项目选址综合考量交通区位、资源配套、政策环境及用地条件等核心要素，拟选定于目标区域工业园区内，占地面积约85亩。\n\n选址地区具备以下优势条件：园区配套水、电、气、网络等基础设施完善，承载能力强；距主干高速公路出口仅3.2公里，物流运输便捷高效；当地政府服务意识强，已出台专项招商政策，在土地价格及税收方面提供支持。\n\n地质勘察报告显示，场地地基承载力满足建设要求，无不良地质现象，工程建设条件优越。`,
  5:`项目采用业内主流技术路线，引进先进自动化生产线，核心工艺技术成熟可靠，已在国内同类项目中得到充分验证，运行稳定。\n\n主要设备选型遵循技术先进、经济合理、节能环保的原则。核心设备拟从国内一流制造商采购，关键技术指标均达到国内先进水平，整体自动化程度高，生产效率较传统工艺提升40%以上。\n\n信息化管理系统方面，将部署MES制造执行系统与ERP系统深度集成，实现生产全流程数字化管控，显著提升运营管理效率，降低人工成本。`,
  6:`项目严格落实国家环保"三同时"制度，废水、废气、固废排放全部达到相应行业排放标准。生产过程中产生的废水经处理后循环利用，废气通过负压收集处理系统处理达标后排放。\n\n安全生产方面，项目严格执行《安全生产法》及相关行业安全规范，配置完善的消防系统、安全监控系统及应急救援设施，确保本质安全。\n\n预计项目建设期内综合能耗指标符合行业准入标准，单位产值能耗低于区域平均水平12%，属于绿色低碳项目。`,
  7:`项目建立现代企业管理制度，采用矩阵式组织架构，设立生产运营、技术研发、市场营销、财务管理、人力资源等核心职能部门。\n\n项目运营期共需员工约320人，其中管理人员45人，技术人员86人，生产工人189人。管理层将通过内部培养与外部引进相结合的方式组建，确保核心岗位人员能力匹配。\n\n建立健全绩效考核体系，以KPI为导向，激励全员提质增效，持续提升组织竞争力。`,
  8:`项目总投资估算为12,680万元，其中建设投资10,240万元，铺底流动资金2,440万元。建设投资包括：土建工程3,820万元、设备购置及安装4,960万元、工程建设其他费用1,460万元。\n\n资金筹措方案：申请银行中长期贷款7,000万元，占总投资的55.2%；企业自筹资金5,680万元，占总投资的44.8%。贷款期限8年，年利率参照同期LPR执行。\n\n资金使用计划：建设期第一年投入4,200万元，主要用于土建施工及设备采购；第二年投入8,480万元，完成设备安装调试及试生产准备。`,
  9:`财务测算基于稳健预测原则，参照行业基准数据，对项目主要财务指标进行综合评价。\n\n主要财务指标：项目建成达产后年营收预计1.86亿元，年净利润2,340万元，净利润率12.6%。项目税后内部收益率（IRR）为18.7%，高于行业基准收益率8%的门槛值；项目投资回收期（含建设期）为6.8年，动态投资回收期7.2年。\n\n敏感性分析显示，在产品售价下降10%或原材料成本上涨15%的不利情景下，项目IRR仍维持在12%以上，具备较强的抗风险能力，财务可行性通过评估。`,
  10:`项目主要面临以下风险及相应对策：\n\n市场风险：市场需求增速不及预期，应对策略为多元化产品结构，锁定核心客户，签订长单框架协议，降低市场波动影响。\n\n技术风险：新工艺引进过程中可能面临技术适配问题，已通过引入原厂技术支持及设立专项技术攻关小组加以应对。\n\n政策风险：行业政策调整可能影响项目盈利空间，需持续跟踪政策动态，保持运营灵活性，及时调整经营策略。\n\n财务风险：融资利率上行将增加财务费用，可通过提前锁定部分固定利率贷款、合理安排还款节奏等方式对冲风险。`,
  11:`综合以上各章节分析，本项目具备以下核心优势：市场空间充足、技术路线成熟、选址条件优越、财务效益良好、风险整体可控。\n\n项目建设符合国家产业政策导向及区域发展规划，对推动地方经济发展、增加就业岗位、促进产业升级具有积极的社会意义。\n\n本报告认为，该项目在技术上可行、经济上合理、财务上可接受，建议有关部门批准立项，推动项目尽快进入实质性建设阶段，以把握当前有利的市场窗口。`,
};

  5:`在技术方案论证阶段，项目团队对国内外主流技术路线进行了系统比较研究，最终确定采用模块化智能制造方案，该方案兼顾技术先进性与投资经济性的平衡。\n\n生产线整体自动化率达78%，关键工序实现全自动化操控。通过引入机器视觉质检系统，产品不良率可控制在0.3%以内，远低于行业平均2.1%的水平，显著提升产品竞争力。\n\n研发创新方面，项目规划每年投入营收的4%用于技术研发，持续迭代产品工艺，构建差异化技术壁垒，确保产品在市场中的长期竞争优势。`,

function FormatBadge({ format }) {

    Word:  { bg: C.tintLavender, color: C.brandPurple800 },

    PPT:   { bg: C.tintRose,     color: "#a02e6d" },
    Excel: { bg: C.tintMint,     color: "#166534" },
  };
  const s = styles[format] || { bg: C.tintGray, color: C.slate };

function FilterGroup({ label, options, value, onChange }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
      <span style={{ fontSize: 13, color: C.stone, flexShrink: 0 }}>{label}：</span>

        <button key={opt} onClick={() => onChange(opt)} style={
          value === opt
            ? { background: C.ink, color: "#fff", borderRadius: 9999, fontSize: 13, padding: "4px 14px", fontWeight: 500, border: "none", cursor: "pointer" }
            : { background: "transparent", color: C.slate, borderRadius: 9999, fontSize: 13, padding: "4px 14px", border: `1px solid ${C.hairline}`, cursor: "pointer" }
        }>
          {opt}
        </button>
      ))}
    </div>
  );
}

function DocCard({ doc, query }) {
  const highlight = (text) => {
    if (!query) return text;
    const parts = text.split(new RegExp(`(${query.split("").join("|")})`, "gi"));
    return parts.map((p, i) =>
      query.split("").some(c => p.toLowerCase() === c.toLowerCase())
        ? <mark key={i} style={{ background: C.tintYellow, color: C.charcoal, borderRadius: 3, padding: "0 2px" }}>{p}</mark>
        : p
    );
  };
  return (
    <div style={{ background: C.canvas, border: `1px solid ${C.hairline}`, borderRadius: 12, padding: "18px 20px", display: "flex", gap: 16 }}
      onMouseEnter={e => e.currentTarget.style.boxShadow = "rgba(15,15,15,0.04) 0px 1px 2px 0px"}
      onMouseLeave={e => e.currentTarget.style.boxShadow = "none"}>
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 8, paddingTop: 2, flexShrink: 0 }}>
        <span style={{ fontSize: 24 }}>📄</span>
        <FormatBadge format={doc.format} />
      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <h3 style={{ fontWeight: 600, color: C.charcoal, fontSize: 15, marginBottom: 6, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
          {highlight(doc.title)}
        </h3>
        <p style={{ fontSize: 14, color: C.slate, lineHeight: 1.55, marginBottom: 8, display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }}>
          {doc.summary}
        </p>
        <div style={{ fontSize: 13, color: C.stone, display: "flex", gap: 16 }}>
          <span>👤 {doc.author}</span>
          <span>📅 {doc.date}</span>
          <span>⬇ {doc.downloads.toLocaleString()}</span>
        </div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", justifyContent: "flex-end", gap: 8, flexShrink: 0 }}>
        <button style={{ fontSize: 13, padding: "6px 16px", border: `1px solid ${C.hairlineStrong}`, color: C.ink, borderRadius: 8, background: C.canvas, cursor: "pointer" }}>
          预览
        </button>
        <button style={{ fontSize: 13, padding: "6px 16px", background: C.primary, color: "#fff", borderRadius: 8, fontWeight: 500, border: "none", cursor: "pointer" }}>
          下载
        </button>
      </div>
    </div>
  );
}

function AITab() {
  const [step, setStep]         = useState("type");
  const [docType, setDocType]   = useState(null);
  const [formStep, setFormStep] = useState(1);
  const [formData, setFormData] = useState({
    industry:"", purpose:"", projectName:"", background:"",
    investment:"", period:"", detail:"", focuses:[], customIndustry:"",
  });
  const [genProgress, setGenProgress] = useState(0);

  const handleSelectType = (type) => { setDocType(type); setStep("form"); setFormStep(1); };
  const handleStartGenerate = () => {
    setStep("generating"); setGenProgress(0);
    let p = 0;
    const iv = setInterval(() => {
      p += Math.random() * 18 + 5;
      if (p >= 100) { p = 100; clearInterval(iv); setTimeout(() => setStep("result"), 400); }
      setGenProgress(Math.min(Math.floor(p), 100));
    }, 280);
  };

  if (step === "type")       return <DocTypeSelect onSelect={handleSelectType} />;
  if (step === "form")       return <FormWizard docType={docType} formStep={formStep} formData={formData} setFormStep={setFormStep} setFormData={setFormData} onBack={() => { if (formStep === 1) setStep("type"); else setFormStep(f => f - 1); }} onGenerate={handleStartGenerate} />;
  if (step === "generating") return <GeneratingScreen progress={genProgress} />;
  if (step === "result")     return <ResultEditor docType={docType} formData={formData} onRestart={() => setStep("type")} />;
  return null;
}

                      style={{
                        border: `1px solid ${selected ? C.primary : C.hairline}`,
                        background: selected ? `${C.primary}12` : disabled ? C.surface : C.canvas,
                        color: selected ? C.primary : disabled ? C.muted : C.charcoal,
                        borderRadius: 8, padding: "8px 12px", fontSize: 14,
                        fontWeight: selected ? 500 : 400,
                        cursor: disabled ? "not-allowed" : "pointer",
                      }}>
                      {selected ? "✓ " : ""}{f}
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
        )}

        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 28, paddingTop: 20, borderTop: `1px solid ${C.hairline}` }}>
          <button onClick={onBack}
            style={{ border: `1px solid ${C.hairlineStrong}`, color: C.ink, borderRadius: 8, padding: "10px 18px", fontSize: 14, fontWeight: 500, background: C.canvas, cursor: "pointer" }}>
            {formStep === 1 ? "← 返回选择" : "← 上一步"}
          </button>
          {formStep < 3 ? (
            <button disabled={formStep === 1 ? !canNext1 : !canNext2}
              onClick={() => setFormStep(f => f + 1)}
              style={{ background: (formStep === 1 ? canNext1 : canNext2) ? C.primary : C.hairline, color: (formStep === 1 ? canNext1 : canNext2) ? "#fff" : C.muted, borderRadius: 8, padding: "10px 20px", fontSize: 14, fontWeight: 500, cursor: (formStep === 1 ? canNext1 : canNext2) ? "pointer" : "not-allowed", border: "none" }}>
              下一步 →
            </button>
          ) : (
            <button disabled={!canGenerate} onClick={onGenerate}
              style={{ background: canGenerate ? C.primary : C.hairline, color: canGenerate ? "#fff" : C.muted, borderRadius: 8, padding: "10px 20px", fontSize: 14, fontWeight: 500, cursor: canGenerate ? "pointer" : "not-allowed", border: "none" }}>
              开始生成
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function GeneratingScreen({ progress }) {
  const msgs    = ["正在分析项目信息...", "构建报告结构框架...", "AI 正在撰写各章节内容...", "优化表达与格式..."];
  const msgIdx  = Math.min(Math.floor(progress / 25), 3);
  const steps   = ["分析行业背景", "生成目录结构", "撰写正文内容", "完善细节数据"];
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "96px 24px" }} className="fade-in">
      <div style={{ width: 72, height: 72, borderRadius: 20, background: C.primary, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 28, boxShadow: `0 8px 24px ${C.primary}40` }}>
        <span style={{ fontSize: 36 }}>🤖</span>
      </div>
      <h3 style={{ fontSize: 22, fontWeight: 600, color: C.ink, marginBottom: 8 }}>AI 正在为您生成报告</h3>
      <p style={{ fontSize: 14, color: C.slate, marginBottom: 48 }}>{msgs[msgIdx]}</p>
      <div style={{ width: 320 }}>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
          <span style={{ fontSize: 13, color: C.stone }}>生成进度</span>
          <span style={{ fontSize: 13, fontWeight: 600, color: C.charcoal }}>{progress}%</span>
        </div>
        <div style={{ height: 6, background: C.hairline, borderRadius: 9999, overflow: "hidden" }}>
          <div style={{ height: "100%", background: C.primary, borderRadius: 9999, width: `${progress}%`, transition: "width 300ms ease" }} />
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 40 }}>
        {steps.map((t, i) => {
          const done = i * 25 < progress;
          return (
            <div key={i} style={{ padding: "8px 16px", borderRadius: 8, fontSize: 13, fontWeight: 500, display: "flex", alignItems: "center", gap: 8, background: done ? C.tintMint : C.surface, color: done ? C.brandGreen : C.stone }}>
              <span>{done ? "✓" : "◌"}</span> {t}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ResultEditor({ docType, formData, onRestart }) {
  const [title, setTitle]           = useState(`${formData.projectName || "XX项目"}可行性研究报告`);
  const [editingTitle, setEditingTitle] = useState(false);
  const [activeChapter, setActiveChapter] = useState(1);
  const [contents, setContents]     = useState(() => {
    const m = {};
    CHAPTERS.forEach(c => { m[c.id] = CHAPTER_CONTENT[c.id] || ""; });
    return m;
  });
  const [editingId, setEditingId]       = useState(null);
  const [editBuffer, setEditBuffer]     = useState("");
  const [regeneratingId, setRegeneratingId] = useState(null);
  const [savedMsg, setSavedMsg]         = useState(false);
  const sectionRefs = useRef({});

  const focusKeys     = { "市场分析":3, "技术方案":5, "财务分析":9, "风险评估":10 };
  const starChapterIds = new Set(formData.focuses.map(f => focusKeys[f]).filter(Boolean));

  const scrollTo   = (id) => { setActiveChapter(id); sectionRefs.current[id]?.scrollIntoView({ behavior:"smooth", block:"start" }); };
  const startEdit  = (id) => { setEditingId(id); setEditBuffer(contents[id]); };
  const saveEdit   = ()   => { setContents(c => ({ ...c, [editingId]: editBuffer })); setEditingId(null); };
  const cancelEdit = ()   => setEditingId(null);
  const regenerate = (id) => {
    setRegeneratingId(id);
    setTimeout(() => { setContents(c => ({ ...c, [id]: CHAPTER_CONTENT_ALT[id] || CHAPTER_CONTENT[id] })); setRegeneratingId(null); }, 1500);
  };
  const handleSaveDraft = () => { setSavedMsg(true); setTimeout(() => setSavedMsg(false), 2000); };
  const chNum = ["一","二","三","四","五","六","七","八","九","十","十一"];

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100vh" }} className="fade-in">
      {/* Toolbar */}
      <div style={{ background: C.canvas, borderBottom: `1px solid ${C.hairline}`, display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 20px", height: 52, flexShrink: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          {editingTitle ? (
            <input style={{ fontSize: 16, fontWeight: 600, color: C.ink, borderBottom: `2px solid ${C.primary}`, background: "transparent", padding: "0 4px", border: "none", borderBottom: `2px solid ${C.primary}` }}
              value={title} onChange={e => setTitle(e.target.value)}
              onBlur={() => setEditingTitle(false)} onKeyDown={e => e.key === "Enter" && setEditingTitle(false)} autoFocus />
          ) : (
            <h1 style={{ fontSize: 16, fontWeight: 600, color: C.ink, cursor: "pointer" }} onClick={() => setEditingTitle(true)}>{title}</h1>
          )}
          <button style={{ color: C.stone, fontSize: 14, background: "none", border: "none", cursor: "pointer" }} onClick={() => setEditingTitle(true)}>✏️</button>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <button onClick={handleSaveDraft} style={{ fontSize: 14, color: savedMsg ? C.brandGreen : C.slate, padding: "6px 12px", background: "none", border: "none", cursor: "pointer" }}>
            {savedMsg ? "✓ 已保存" : "保存草稿"}
          </button>
          <button onClick={onRestart} style={{ fontSize: 14, padding: "7px 16px", border: `1px solid ${C.hairlineStrong}`, color: C.ink, borderRadius: 8, background: C.canvas, cursor: "pointer" }}>
            重新生成
          </button>
          <button style={{ fontSize: 14, padding: "7px 16px", background: C.primary, color: "#fff", borderRadius: 8, fontWeight: 500, border: "none", cursor: "pointer" }}>
            导出 Word ↓
          </button>
        </div>
      </div>

      <div style={{ display: "flex", flex: 1, minHeight: 0 }}>
        {/* Outline */}
        <div style={{ width: 220, background: C.surfaceSoft, borderRight: `1px solid ${C.hairline}`, overflowY: "auto", flexShrink: 0 }}>
          <div style={{ padding: "12px 16px", borderBottom: `1px solid ${C.hairline}` }}>
            <span style={{ fontSize: 11, fontWeight: 600, color: C.stone, textTransform: "uppercase", letterSpacing: 1 }}>文档大纲</span>
          </div>
          <nav style={{ padding: 8 }}>
            {CHAPTERS.map(ch => {
              const isStar   = starChapterIds.has(ch.id);
              const isActive = activeChapter === ch.id;
              return (
                <button key={ch.id} onClick={() => scrollTo(ch.id)}
                  style={{ width: "100%", textAlign: "left", padding: "8px 12px", borderRadius: 8, display: "flex", alignItems: "center", gap: 6, marginBottom: 2, background: isActive ? C.canvas : "transparent", color: isActive ? C.ink : C.slate, fontWeight: isActive ? 500 : 400, fontSize: 14, cursor: "pointer", border: "none", boxShadow: isActive ? "rgba(15,15,15,0.05) 0px 1px 3px 0px" : "none" }}>
                  <span style={{ color: C.stone, fontSize: 12, width: 18, flexShrink: 0 }}>{ch.id}.</span>
                  <span style={{ flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{ch.title}</span>
                  {isStar && <span style={{ color: "#dd5b00", fontSize: 11, flexShrink: 0 }}>⭐</span>}
                </button>
              );
            })}
          </nav>
        </div>

        {/* Content */}
        <div style={{ flex: 1, background: C.surface, overflowY: "auto" }}>
          <div style={{ maxWidth: 760, margin: "0 auto", padding: "24px 24px 80px" }}>
            {CHAPTERS.map(ch => {
              const isStar   = starChapterIds.has(ch.id);
              const isEditing = editingId === ch.id;
              const isRegen   = regeneratingId === ch.id;
              return (
                <div key={ch.id} ref={el => sectionRefs.current[ch.id] = el}
                  style={{ background: C.canvas, border: `1px solid ${C.hairline}`, borderRadius: 12, overflow: "hidden", marginBottom: 16 }}>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 20px", borderBottom: `1px solid ${C.hairline}`, background: C.surfaceSoft }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <h2 style={{ fontSize: 15, fontWeight: 600, color: C.ink }}>
                        {chNum[ch.id - 1]}、{ch.title}
                      </h2>
                      {isStar && (
                        <span style={{ fontSize: 12, background: C.tintLavender, color: C.brandPurple800, borderRadius: 6, padding: "2px 8px", fontWeight: 600 }}>
                          ⭐ 重点章节
                        </span>
                      )}
                    </div>
                    {!isEditing && !isRegen && (
                      <div style={{ display: "flex", gap: 4 }}>
                        <button onClick={() => regenerate(ch.id)} title="重新生成"
                          style={{ width: 30, height: 30, display: "flex", alignItems: "center", justifyContent: "center", borderRadius: 6, color: C.stone, fontSize: 14, background: "transparent", border: "none", cursor: "pointer" }}>🔄</button>
                        <button onClick={() => startEdit(ch.id)} title="编辑"
                          style={{ width: 30, height: 30, display: "flex", alignItems: "center", justifyContent: "center", borderRadius: 6, color: C.stone, fontSize: 14, background: "transparent", border: "none", cursor: "pointer" }}>✏️</button>
                      </div>
                    )}
                  </div>
                  <div style={{ padding: "16px 20px" }}>
                    {isRegen ? (
                      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                        {[100, 85, 70, 80, 60].map((w, i) => (
                          <div key={i} className="skeleton" style={{ height: 16, borderRadius: 4, width: `${w}%` }} />
                        ))}
                      </div>
                    ) : isEditing ? (
                      <div>
                        <textarea
                          style={{ width: "100%", border: `1px solid ${C.primary}`, borderRadius: 8, padding: "12px 16px", fontSize: 14, color: C.charcoal, lineHeight: 1.75, resize: "none" }}
                          rows={8} value={editBuffer} onChange={e => setEditBuffer(e.target.value)} autoFocus />
                        <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                          <button onClick={saveEdit} style={{ background: C.primary, color: "#fff", borderRadius: 8, padding: "6px 16px", fontSize: 14, fontWeight: 500, border: "none", cursor: "pointer" }}>保存</button>
                          <button onClick={cancelEdit} style={{ border: `1px solid ${C.hairlineStrong}`, color: C.ink, borderRadius: 8, padding: "6px 16px", fontSize: 14, background: C.canvas, cursor: "pointer" }}>取消</button>
                        </div>
                      </div>
                    ) : (
                      <div style={{ fontSize: 14, color: C.charcoal, lineHeight: 1.75, whiteSpace: "pre-line" }}>{contents[ch.id]}</div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{ position: "sticky", bottom: 0, background: "rgba(255,255,255,0.92)", borderTop: `1px solid ${C.hairline}`, backdropFilter: "blur(8px)" }}>
            <div style={{ maxWidth: 760, margin: "0 auto", padding: "10px 24px", fontSize: 13, color: C.stone }}>
              💡 点击章节右侧编辑按钮可修改内容，完成后点击「导出 Word」下载
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── App shell ────────────────────────────────────────────────────────────────

  const [tab, setTab] = useState("search");

  return (
    <div style={{ minHeight: "100vh", background: C.canvas }}>
      {/* Navbar */}
      <nav style={{ position: "fixed", top: 0, left: 0, right: 0, height: 64, background: C.canvas, borderBottom: `1px solid ${C.hairline}`, zIndex: 50, display: "flex", alignItems: "center", padding: "0 24px" }}>
        {/* Brand */}
        <div style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer", flexShrink: 0 }} onClick={() => setTab("search")}>
          <div style={{ width: 28, height: 28, background: C.primary, borderRadius: 6, display: "flex", alignItems: "center", justifyContent: "center" }}>
            <span style={{ color: "#fff", fontSize: 13, fontWeight: 700 }}>文</span>
          </div>
          <span style={{ fontWeight: 600, fontSize: 15, color: C.ink }}>360文库</span>
        </div>

        {/* Tabs — centered, segmented-tab style (underline active) */}
        <div style={{ position: "absolute", left: "50%", transform: "translateX(-50%)", display: "flex", alignItems: "stretch", height: 64 }}>
          {[
            { key: "search", label: "搜索文档" },
            { key: "ai",     label: "AI 生成" },
          ].map(t => (
            <button key={t.key} onClick={() => setTab(t.key)}
              style={{
                padding: "0 20px", fontSize: 14, fontWeight: 500, background: "transparent", border: "none", cursor: "pointer",
                color: tab === t.key ? C.ink : C.steel,
                borderBottom: tab === t.key ? `2px solid ${C.ink}` : "2px solid transparent",
                transition: "color 0.15s, border-color 0.15s",
              }}>
              {t.label}
            </button>
          ))}
        </div>

        {/* Right side */}
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginLeft: "auto" }}>
          <button style={{ fontSize: 14, fontWeight: 500, padding: "8px 16px", border: `1px solid ${C.hairlineStrong}`, borderRadius: 8, color: C.ink, background: C.canvas, cursor: "pointer" }}>
            会员中心
          </button>
          <div style={{ width: 32, height: 32, borderRadius: "50%", background: C.primary, display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
            U
          </div>
        </div>
      </nav>

      {/* Content */}
      <main style={{ paddingTop: 64, minHeight: "100vh" }}>
        {tab === "search"
          ? <SearchTab onGoToAI={() => setTab("ai")} />
          : <AITab />
        }
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
